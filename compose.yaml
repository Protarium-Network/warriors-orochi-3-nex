services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wo3
      POSTGRES_USER: wo3
      POSTGRES_PASSWORD: wo3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wo3 -d wo3"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - wo3-postgres:/var/lib/postgresql/data

  nex:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PN_WO3_AUTH_PORT: "29000"
      PN_WO3_SECURE_PORT: "29001"
      # The address a console is told to reach the secure server on. Override
      # in .env or the shell; defaults to localhost for a LAN test.
      PN_WO3_SECURE_HOST: ${PN_WO3_SECURE_HOST:-localhost}
      PN_WO3_POSTGRES_URI: postgres://wo3:wo3@postgres:5432/wo3?sslmode=disable
      PN_WO3_KERBEROS_PASSWORD: ${PN_WO3_KERBEROS_PASSWORD:-change-me}
      # Local preservation mode: accounts from settings.json, login token not
      # validated. Flip to shared mode by setting PN_WO3_LOCAL_MODE=0
      # and providing the two NEX_* secrets (matching your account server).
      PN_WO3_LOCAL_MODE: ${PN_WO3_LOCAL_MODE:-1}
      PN_WO3_LEGACY_SIGNATURE: ${PN_WO3_LEGACY_SIGNATURE:-}
      PN_WO3_SETTINGS_PATH: /home/go/app/settings.json
      PN_WO3_NEX_TOKEN_AES_KEY: ${PN_WO3_NEX_TOKEN_AES_KEY:-}
      PN_WO3_NEX_PASSWORD_SECRET: ${PN_WO3_NEX_PASSWORD_SECRET:-}
      # Optional S3 for DataStore object uploads (downloads work without it).
      PN_S3_ENDPOINT: ${PN_S3_ENDPOINT:-}
      PN_S3_ACCESS_KEY: ${PN_S3_ACCESS_KEY:-}
      PN_S3_SECRET_KEY: ${PN_S3_SECRET_KEY:-}
      PN_S3_BUCKET: ${PN_S3_BUCKET:-wo3-datastore}
    ports:
      - "29000:29000/udp"
      - "29001:29001/udp"
    volumes:
      - ./settings.json:/home/go/app/settings.json:ro

volumes:
  wo3-postgres:
